# Dependabot auto-merge workflow.
#
# Phase 2: auto-merge patch + minor for github_actions, cargo, npm, pip, gomod.
# Docker stays manual indefinitely (nginx:1.30-alpine-slim curl regression precedent).
# Major version bumps across all ecosystems still queue for human review.
#
# Security note: PR_URL is sourced from `github.event.pull_request.html_url`,
# which is GitHub-generated (not user-controlled), routed through env: with
# quoted "$PR_URL" expansion — no direct ${{ }} interpolation in run:.

name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Lockfile guard for npm bumps. Dependabot sometimes drops still-required
      # nested package-lock.json entries, leaving it out of sync with
      # package.json; a strict `npm ci` then fails. Reproduce that install here
      # so a drifted lockfile fails the job and the auto-merge step below — whose
      # `if` has no status function, so it implies success() — is skipped. Gated
      # on a root package-lock.json existing (the hashFiles check needs the
      # checkout, hence checkout runs first).
      - name: Checkout
        if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
        uses: actions/checkout@v7

      - name: Set up Node
        if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn' && hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify lockfile is in sync (npm ci)
        if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn' && hashFiles('package-lock.json') != ''
        run: npm ci --no-audit --no-fund

      - name: Enable auto-merge for low-risk updates
        if: |
          (steps.meta.outputs.package-ecosystem == 'github_actions' ||
           steps.meta.outputs.package-ecosystem == 'cargo' ||
           steps.meta.outputs.package-ecosystem == 'npm_and_yarn' ||
           steps.meta.outputs.package-ecosystem == 'pip' ||
           steps.meta.outputs.package-ecosystem == 'gomod') &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
