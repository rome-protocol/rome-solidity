# GitGuardian configuration for rome-solidity.
#
# ignored_paths — files excluded from secret scanning. Each entry MUST have an
# inline comment explaining why it is a false-positive; reviewers check this.
#
# ignored_matches — specific known-public values whitelisted by the raw
# secret (GitGuardian also accepts a SHA256 here). Use this for literals
# that will recur across the repo (e.g. canonical public Solana program
# IDs baked into tests, docs, and constants).

version: 2

secret:
  ignored_paths:
    # Canonical public Solana program IDs (System Program, SPL Token,
    # Associated Token, Token-2022, Sysvars) — bs58-decoded to bytes32 and
    # asserted equal to the Solidity constants. They are global public
    # identifiers, not secrets. GitGuardian incident 29891132 flagged the
    # bs58 strings as "Generic High Entropy Secret"; this whitelist clears
    # that false positive without disabling the Generic High Entropy
    # detector for the rest of the repo.
    - tests/cpi/SolanaConstants.test.ts
    # v6 CCTP-v2 bridge tests + PDA-derivation script assert against the
    # account list + instruction bytes of a LANDED public devnet CCTP v2
    # deposit_for_burn. Every bs58 string is a public Solana pubkey (program
    # id / config PDA / ATA / canonical devnet USDC mint) read straight
    # off-chain — public identifiers, not secrets. Same false-positive class
    # as SolanaConstants.test.ts ("Generic High Entropy Secret").
    - tests/bridge/cctp_v2_lib.test.ts
    - tests/bridge/rome_bridge_withdraw_v6.test.ts
    - tests/bridge/derive.test.ts
    - scripts/bridge/derive/cctp-accounts.ts
  ignored_matches:
    # Canonical public Solana program IDs. These are NOT secrets — they are
    # the globally-published program IDs every Solana client must recognize.
    # Source: Solana docs + Anchor IDLs.
    - name: SPL Token program ID (public)
      match: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
    - name: Associated Token Account program ID (public)
      match: ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL
    - name: Token-2022 program ID (public)
      match: TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb
    # CCTP v2 public program IDs — deterministic, globally-published (same on
    # devnet + mainnet). Recur across v6 bridge contract, constants, tests.
    - name: CCTP v2 TokenMessengerMinter program ID (public)
      match: CCTPV2vPZJS2u2BBsUoscuikbYjnpFmbFsvVuJdgUMQe
    - name: CCTP v2 MessageTransmitter program ID (public)
      match: CCTPV2Sm4AdWt5296sk4P66VBZ7bEhcARwFaaS9YPbeC
    # Public CCTP v2 config PDAs on Solana devnet (token_messenger,
    # token_minter, local_token for the canonical devnet USDC mint). Derived
    # deterministically from the public program IDs; asserted in derive.test.ts
    # as ground truth against a landed public deposit_for_burn. Not secrets.
    - name: CCTP v2 token_messenger config PDA (devnet, public)
      match: AawthJCGRmggpfv9MMWV6Jmo9cue4gL9wUZgRBShg58W
    - name: CCTP v2 token_minter PDA (devnet, public)
      match: E1bQJ8eMMn3zmeSewW3HQ8zmJr7KR75JonbwAtWx2bux
    - name: CCTP v2 local_token USDC PDA (devnet, public)
      match: 7MwmWTK2R9Na6rnoSAEt5gytFmSZj9WLVdazvxvru9AU
